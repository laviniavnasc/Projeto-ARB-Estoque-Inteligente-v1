{% extends "base.html" %}
{% block title %}Editar produtos — ARB{% endblock %}
{% block content %}
<section class="page form-page">
  <a class="back" href="{{ url_for('home') }}">←</a><div class="page-icon arb-mark">ARB</div><h1>Editar<br>produtos</h1>
  {% if product %}
  <form class="product-form" method="post">
    <input type="hidden" name="code" value="{{ product.code }}">
    <label>Código do produto<input value="{{ product.code }}" disabled></label>
    <label>Nome do produto<input value="{{ product.name }}" disabled></label>
    <label>Insira a quantidade<div class="input-row"><input name="quantity" type="number" step="0.01" min="0" value="{{ product.quantity }}" required><select name="unit">{% for u in ['Kg','g','L','ml','un'] %}<option value="{{ u }}" {% if product.unit==u %}selected{% endif %}>{{ u }}</option>{% endfor %}</select></div></label>
    <label>Insira a validade<input name="expiry_date" type="date" value="{{ product.expiry_date or '' }}"></label>
    <button class="primary" type="submit">Editar</button>
  </form>
  {% else %}
    {% if searched %}<div class="empty">Produto não encontrado.</div>{% endif %}
    <form class="product-form" method="get"><label>Insira o código do produto<input name="code" placeholder="Ex.: P001" required></label><button class="primary" type="submit">Buscar</button></form>
  {% endif %}
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Login — ARB Estoque Inteligente{% endblock %}

{% block content %}
<section class="login-page">

  <div class="login-art">
    <div class="art-blob"></div>
    <div class="art-cake">
      <img src="{{ url_for('static', filename='images/icone.png') }}" alt="">
    </div>
    <div class="art-title">Estoque<br><em>Inteligente</em></div>
    <div class="art-subtitle">para confeitaria</div>
    <div class="art-cupcakes">
      <img src="{{ url_for('static', filename='images/cupcakes.png') }}" alt="">
    </div>
    <div class="art-tools">⌁</div>
  </div>

  <div class="login-card">

<!--VERSÃO P CELULAR-->
    <div class="mobile-cake"><img src="{{ url_for('static', filename='images/icone.png') }}" alt="">
    </div>

    <h1>Estoque <em>Inteligente</em></h1>
    <p class="subtitle">para confeitaria</p>

    <form method="post">

      <label>
        <span>✉</span>
        <input
          type="email"
          name="email"
          autocomplete="email"
          placeholder="Insira seu e-mail"
          required
        >
      </label>

      <label>
        <span>▣</span>
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          placeholder="Insira sua senha"
          required
        >

        <button
          type="button"
          class="show-pass"
          onclick="togglePassword()"
        >◉</button>
      </label>

      <button class="primary big" type="submit">
        Entrar
      </button>

    </form>
  </div>

</section>
{% endblock %}
